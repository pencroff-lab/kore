# Titles, ordering and section metadata for the current documentation edition.
#
# `path` is relative to docs/. A page without an entry keeps its first H1 as the
# title and sorts after every listed page. Snapshots capture their own copy of
# this file, so changing it never alters a released edition.
schemaVersion: 1

sections:
  - path: api
    title: API reference
    weight: 20
    description: Generated from the source comments on every exported symbol.
  - path: guides
    title: Guides
    weight: 30
    description: Task-oriented explanations of how the library is meant to be used.
  - path: examples
    title: Examples
    weight: 40
    description: Executable examples, generated from the library's own test suite.

